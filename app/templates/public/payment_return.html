{% extends "base.html" %}
{% block title %}Verifying payment{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="spinner-border text-primary mb-3" role="status"><span class="visually-hidden">Loading</span></div>
  <h1 class="h4">We are verifying your payment</h1>
  <p class="text-muted">Payments are confirmed only after the payment provider notifies us directly. Returning to this page does not mark an order as paid.</p>
  <a class="btn btn-primary" href="{{ url_for('customer.orders') }}">View my orders</a>
</div>
{% endblock %}
